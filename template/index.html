<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta Tags -->
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">

    <!-- CSS Links -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">

    <!-- JavaScript Links -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <title>Pose Estimation</title>

    <!-- Custom CSS -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            margin: 0;
            padding: 0;
            overflow-x: hidden; /* Prevent horizontal scroll */
        }

        .container {
            max-width: 100%;
            padding: 0 10px; /* Add space to the sides of the container */
        }

        /* Video styles */
        /* Video container styles */
        .video-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start; /* Align items to the start (left) */
            align-items: center; /* Center items vertically */
        }

        /* Video styles */
        #videoFeed {
            width: 90%; /* Riduce la larghezza del video feed al 90% */
            height: auto;
            border-radius: 10px;
            padding-bottom: 15px;
            margin-right: 20px;
            margin-left: 20px;
        }

        /* Heading styles */
        h2.text-center {
            margin-top: 20px;
            margin-bottom: 20px;
            font-size: 2.5em;
            font-weight: bold;
            color: #0056b3; /* Slightly darker color */
            text-align: center;
            position: relative;
        }

        h2.text-center::after {
            content: '';
            display: block;
            width: 60px;
            height: 4px;
            background-color: #0056b3; /* Slightly darker color */
            margin: 10px auto 0;
            border-radius: 2px;
        }

        /* Button group styles */
        .button-group {
            flex-basis: 100%; /* Full width on smaller screens */
            max-width: 100%;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .btn-custom {
            width: 100%;
            margin-bottom: 10px;
            background-color: #007bff;
            border-color: #007bff;
            color: #fff;
            border-radius: 5px; /* Make buttons similar to the previous style */
            padding: 10px;
            font-size: 1.1em;
            transition: background-color 0.3s, border-color 0.3s; /* Add transition for hover effect */
        }

        .btn-custom:hover {
            background-color: #0056b3;
            border-color: #0056b3;
        }

        @media (min-width: 768px) {
            .col-lg-9 {
                flex: 0 0 70%; /* Reduced to 70% width */
                max-width: 70%; /* Reduced to 70% width */
            }

            .button-group {
                flex: 0 0 30%; /* Increased to 30% width */
                max-width: 30%; /* Increased to 30% width */
                margin-top: auto;
                margin-bottom: auto; /* Center vertically */
            }
        }

        @media (max-width: 576px) {
            h2.text-center {
                font-size: 1.5em;
            }

            .btn-custom {
                padding: 8px 16px;
                font-size: 0.9em;
            }
        }
    </style>

</head>
<body>
<div class="container">
    <!-- Main Content -->
    <div class="row">
        <div class="col-lg-10 offset-lg-1 mt-5">
            <h2 class="text-center">Posture Risk Assessment</h2>

            <!-- Video Feed and Controls -->
            <div class="video-container">
                <!-- Video Feed (occupies 3/4 of the width) -->
                <div class="col-lg-9">
                    <img id="videoFeed" src="{{ url_for('video_feed') }}">
                </div>

                <!-- Buttons and Plots (occupies 1/4 of the width) -->
                <div class="col-lg-3 button-group">
                    <form action="{{ url_for('tasks') }}" id="tasksForm" method="post">
                        <input class="btn-custom" id="cameraButton" name="stop" type="submit"
                               value="Open Video Camera"/>
                        <input class="btn-custom" id="sessionButton" name="session" type="submit"
                               value="Start Session"/>
                        <input class="btn-custom" name="segmask" type="submit" value="Segmentation Mask"/>
                    </form>

                    <!-- JSON File Selector -->
                    <form action="{{ url_for('show_all_plots') }}" method="post">
                        <input class="btn-custom" type="submit" value="Show Statistics"/>
                        <select class="form-control" id="jsonFileSelector" name="json_file">
                            <!-- Options will be populated by JavaScript -->
                        </select>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- JavaScript to change button text and populate JSON file selector -->
<script>
    $(document).ready(function () {
        var cameraButton = $('#cameraButton');
        var sessionButton = $('#sessionButton');

        var cameraState = localStorage.getItem('cameraState') || "Open Video Camera";
        var sessionState = localStorage.getItem('sessionState') || "Start Session";

        cameraButton.val(cameraState);
        sessionButton.val(sessionState);

        cameraButton.click(function () {
            if (cameraState === 'Open Video Camera') {
                cameraState = 'Close Video Camera';
            } else {
                cameraState = 'Open Video Camera';
            }
            cameraButton.val(cameraState);

            localStorage.setItem('cameraState', cameraState);

            $('#tasksForm').submit();
        });

        sessionButton.click(function () {
            if (sessionState === 'Start Session') {
                sessionState = 'Stop Session';
            } else {
                sessionState = 'Start Session';
            }
            sessionButton.val(sessionState);

            localStorage.setItem('sessionState', sessionState);

            $('#tasksForm').submit();
        });

        // Populate JSON file selector
        $.getJSON("{{ url_for('get_json_files') }}", function (data) {
            var jsonFileSelector = $('#jsonFileSelector');
            jsonFileSelector.empty(); // Clear existing options
            $.each(data.json_files, function (index, filename) {
                jsonFileSelector.append($('<option>', {
                    value: filename,
                    text: filename
                }));
            });
        });
    });
</script>

</body>
</html>
