<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta Tags -->
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">

    <!-- CSS Links -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">

    <!-- JavaScript Links -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <title>Pose Estimation</title>

    <!-- Custom CSS -->
    <style>
        #videoFeed {
            width: 100%;
            height: auto;
            border-radius: 10px;
            padding-bottom: 15px;
            margin-right: 20px
        }

        .container {
            max-width: 100%;
            padding: 0 10px; /* Aggiunge spazio ai lati del container */
        }

        /* Stile per separare il video e i bottoni */
        .video-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
        }

        h2.text-center {
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .button-group {
            flex-basis: 20%;
            max-width: 20%;
            padding-left: 10px;
            padding-top: 10%;
        }

        .btn-custom {
            width: 100%;
            margin-bottom: 10px;
            background-color: #007bff;
            border-color: #007bff;
            color: #fff;
        }
    </style>

</head>
<body>
<div class="container">
    <!-- Main Content -->
    <div class="row">
        <div class="col-lg-8 offset-lg-2 mt-5">
            <h2 class="text-center">Posture Risk Assessment</h2>

            <!-- Video Feed and Controls -->
            <div class="video-container">
                <!-- Video Feed (occupa 2/3 della larghezza) -->
                <div class="col-lg-8">
                    <img id="videoFeed" src="{{ url_for('video_feed') }}">
                </div>

                <!-- Buttons and Plots (occupa 1/3 della larghezza) -->
                <div class="col-lg-4 button-group">
                    <form action="{{ url_for('tasks') }}" method="post">
                        <input class="btn-custom" name="stop" type="submit" value="Stop/Start"/>
                        <input class="btn-custom" name="segmask" type="submit" value="Segmentation Mask"/>
                        <input class="btn-custom" name="save" type="submit" value="Save Data"/>
                    </form>

                    <form action="{{ url_for('show_all_plots') }}" method="get">
                        <input class="btn-custom" type="submit" value="Show All Plots"/>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
