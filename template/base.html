<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f6f2">
    <meta name="description" content="A simple workspace to observe your posture and explore your recorded sessions.">
    <title>{% block title %}Posture Risk Assessment{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg', v=2) }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    {% block styles %}{% endblock %}
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>
{% include '_icons.html' %}
<header class="site-header">
    <div class="shell header-inner">
        <a class="brand" href="{{ url_for('index') }}" aria-label="Posture Risk Assessment home">
            <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#icon-posture"></use></svg></span>
            <h1>Posture Risk Assessment</h1>
        </a>
        <nav class="header-nav" aria-label="Main navigation">{% block navigation %}{% endblock %}</nav>
    </div>
</header>
<main class="shell main-content" id="main-content">{% block content %}{% endblock %}</main>
<footer class="shell site-footer">
    <span>Posture Risk Assessment</span>
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
