<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta Tags -->
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">

    <!-- CSS Links -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">

    <!-- JavaScript Links -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <title>Show All Plots</title>

    <!-- Custom CSS -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            margin: 0;
            padding: 0;
        }

        .container-fluid {
            padding: 20px;
        }

        /* Heading styles */
        h1.text-center {
            margin-top: 20px;
            margin-bottom: 20px;
            font-size: 2.5em;
            font-weight: bold;
            color: #0056b3; /* Slightly darker color */
            text-align: center;
            position: relative;
        }

        h1.text-center::after {
            content: '';
            display: block;
            width: 60px;
            height: 4px;
            background-color: #0056b3; /* Slightly darker color */
            margin: 10px auto 0;
            border-radius: 2px;
        }

        h2.text-left {
            font-size: 1.5em;
            margin: 15px 0;
            font-weight: bold;
        }

        /* Image styles */
        .plot-container img {
            width: 100%;
            display: block;
            border-radius: 10px;
            padding-top: 20px;
            background-color: #f8f9fa; /* Background color for images */
        }

        /* Container border styles */
        .plot-container {
            border: 2px solid #dee2e6; /* Slightly darker border color */
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1), 0 6px 20px rgba(0, 0, 0, 0.1);
            background-color: #f8f9fa; /* Background color for plot container */
            margin-top: 20px; /* Add margin to space out plot containers */
        }

        /* Button styles */
        .btn-primary {
            background-color: #007bff;
            color: #fff;
            padding: 15px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
        }

        .btn-primary:hover {
            background-color: #0056b3;
        }

        /* Responsive styles */
        @media (max-width: 768px) {
            .plot-container img {
                padding-top: 10px;
            }
        }

        @media (max-width: 576px) {
            h1.text-center {
                font-size: 1.5em;
            }

            h2.text-left {
                font-size: 1.2em;
            }

            .btn-primary {
                padding: 8px 16px;
                font-size: 0.9em;
            }

            .plot-container {
                padding: 10px;
            }

            .plot-container img {
                padding-top: 10px;
            }
        }

    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-12 mt-5">
            <h1 class="text-center">Posture Statistics</h1>
            <div class="row">
                <div class="col-md-6 plot-container">
                    <h2 class="text-left">Body Joint Angles</h2>
                    <img alt="Plot of body joint angles over time" id="plot"
                         src="{{ url_for('plot_posture_in_time') }}">
                </div>
                <div class="col-md-6 plot-container">
                    <h2 class="text-left">Posture Status</h2>
                    <img alt="Plot of posture status" id="postureStatus" src="{{ url_for('plot_posture_status') }}">
                </div>
            </div>
            <div class="row">
                <div class="col-12 plot-container">
                    <h2 class="text-left">Posture Risk Percentage</h2>
                    <img alt="Pie charts showing posture risk percentage" id="piecharts"
                         src="{{ url_for('plot_pie_charts') }}">
                </div>
            </div>
            <div class="row">
                <div class="col-12 text-center">
                    <button class="btn btn-primary" id="back-button" onclick="window.history.back()">Back to homepage
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
